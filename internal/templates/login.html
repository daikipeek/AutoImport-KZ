{{define "login.html"}}{{template "layout.html" .}}{{end}}

{{define "login_content"}}
<div class="page-narrow">
  <div class="page-head">
    <div class="page-icon">LOG IN</div>
    <h2>Welcome Back</h2>
    <p>Sign in to your AutoImport KZ account</p>
  </div>

  {{if .Error}}
    <div class="alert">{{.Error}}</div>
  {{end}}

  <form method="post" action="/auth/login" class="form">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="********" required />
    </div>

    <button type="submit">Sign In</button>
  </form>

  <div class="page-foot">
    <span>Do not have an account?</span>
    <a class="link" href="/register">Create one -></a>
  </div>
</div>
{{end}}
